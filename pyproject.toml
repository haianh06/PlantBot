[project]
name = "plantbot"
version = "0.1.0"
description = "Hệ thống IoT chăm sóc cây tự động — PlantBot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyserial>=3.5",
    "opencv-python>=4.10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=13.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "pillow>=10.0",
]
